<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="WAR REPORT wordmark">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6426"/>
      <stop offset=".22" stop-color="#c79b45"/>
      <stop offset=".42" stop-color="#f0d07e"/>
      <stop offset=".58" stop-color="#b98d38"/>
      <stop offset=".8" stop-color="#e9c878"/>
      <stop offset="1" stop-color="#6d5020"/>
    </linearGradient>
    <linearGradient id="bronzeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c3612"/>
      <stop offset=".5" stop-color="#8a6426"/>
      <stop offset="1" stop-color="#33240c"/>
    </linearGradient>
    <filter id="distress" x="-4%" y="-8%" width="108%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.14" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glowRed" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
    </filter>
  </defs>

  <!-- red waveform accent, left -->
  <g fill="#ff2b2b">
    <rect x="30" y="318" width="10" height="26" rx="2" opacity=".85"><animate attributeName="height" values="26;44;26" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="46" y="308" width="10" height="44" rx="2" opacity=".95"><animate attributeName="height" values="44;54;44" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="62" y="322" width="10" height="18" rx="2" opacity=".8"><animate attributeName="height" values="18;36;18" dur=".9s" repeatCount="indefinite"/></rect>
  </g>
  <!-- red waveform accent, right -->
  <g fill="#ff2b2b" filter="url(#glowRed)">
    <rect x="914" y="318" width="10" height="26" rx="2" opacity=".85"><animate attributeName="height" values="26;44;26" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="930" y="308" width="10" height="44" rx="2" opacity=".95"><animate attributeName="height" values="44;54;44" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="946" y="322" width="10" height="18" rx="2" opacity=".8"><animate attributeName="height" values="18;36;18" dur=".9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- shadow layer -->
  <g transform="translate(6,8)">
    <text x="120" y="170" font-family="Impact,'Arial Black',sans-serif" font-size="168" font-weight="900" letter-spacing="10" fill="#000" opacity=".55">WAR</text>
    <text x="322" y="330" font-family="Impact,'Arial Black',sans-serif" font-size="168" font-weight="900" letter-spacing="14" fill="#000" opacity=".55">REPORT</text>
  </g>

  <!-- metallic distressed letters -->
  <g filter="url(#distress)">
    <text x="120" y="170" font-family="Impact,'Arial Black',sans-serif" font-size="168" font-weight="900" letter-spacing="10" fill="url(#bronze)" stroke="#3d2c0e" stroke-width="1.5">WAR</text>
    <text x="322" y="330" font-family="Impact,'Arial Black',sans-serif" font-size="168" font-weight="900" letter-spacing="14" fill="url(#bronze)" stroke="#3d2c0e" stroke-width="1.5">REPORT</text>
  </g>
  <!-- sheen band -->
  <rect x="60" y="0" width="46" height="380" fill="#fff" opacity=".05" transform="skewX(-16)"/>

  <!-- kicker above -->
  <text x="500" y="56" text-anchor="middle" font-family="Georgia,serif" font-size="30" letter-spacing="12" fill="#e9c878">WE ARE ONE</text>

  <!-- under-line -->
  <g transform="translate(500,368)">
    <rect x="-250" y="0" width="500" height="2" fill="url(#bronze)"/>
    <rect x="-250" y="5" width="500" height="2" fill="url(#bronze)" opacity=".4"/>
  </g>
  <text x="500" y="404" text-anchor="middle" font-family="Impact,'Arial Narrow',sans-serif" font-size="26" letter-spacing="10" fill="#6f7a6e" opacity=".9">DIGITAL NEWS</text>
</svg>
